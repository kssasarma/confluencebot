app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # How long a refresh token stays valid (ISO-8601 duration)
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  cors:
    # Browser origins allowed to call the API. The bundled nginx proxies /api on the same origin,
    # so this only matters when the UI is served from somewhere else.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  application:
    name: confluence-chatbot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confluencebot}
    username: ${DB_USERNAME:confluencebot}
    password: ${DB_PASSWORD:confluencebot}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000

  mvc:
    async:
      # Backstop only. Keep it above chat.stream.timeout so a slow answer is ended by the emitter,
      # which closes the stream cleanly, rather than by the container.
      request-timeout: ${ASYNC_REQUEST_TIMEOUT_MS:240000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate           # Flyway owns schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    openai:
      base-url: ${AI_BASE_URL:http://localhost:11434/v1}
      api-key: ${AI_API_KEY:dummy}
      chat:
        options:
          model: ${CHAT_MODEL:openai/llama-4-17b-maverick}
          temperature: ${CHAT_TEMPERATURE:0.1}
          max-tokens: ${CHAT_MAX_TOKENS:2048}
      embedding:
        options:
          model: ${EMBED_MODEL:openai/snowflake-arctic}
    vectorstore:
      pgvector:
        table-name: confluence_chunks    # must match V2 migration
        schema-name: public
        initialize-schema: false         # Flyway manages all DDL
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024                 # snowflake-arctic-embed-l produces 1024-dim vectors

# Bound to ConfluenceProperties record
confluence:
  base-url: ${CONFLUENCE_BASE_URL}
  pat: ${CONFLUENCE_PAT}
  space-key: ${CONFLUENCE_SPACE_KEY}
  page-fetch-limit: ${CONFLUENCE_PAGE_FETCH_LIMIT:250}
  request-timeout-seconds: ${CONFLUENCE_REQUEST_TIMEOUT_SECONDS:30}

# Bound to ChatRetrievalProperties record
chat:
  retrieval:
    # Final number of chunks sent to the LLM
    top-k: ${CHAT_TOP_K:5}

    # Minimum cosine similarity for confidence caveat (not a hard filter)
    similarity-threshold: ${CHAT_SIMILARITY_THRESHOLD:0.70}

    # Candidate pool for hybrid search before RRF fusion + re-ranking
    candidate-pool-size: ${CHAT_CANDIDATE_POOL_SIZE:25}

    # Chunking parameters (roughly 4 chars/token)
    chunk-size: ${CHAT_CHUNK_SIZE:800}
    chunk-overlap: ${CHAT_CHUNK_OVERLAP:100}

    # MMR re-ranking: lambda controls relevance vs diversity trade-off (1.0 = pure relevance)
    rerank-mmr-lambda: ${CHAT_RERANK_MMR_LAMBDA:0.7}

    # Blend weight: 0.5 = equal weight to RRF fusion score and dense cosine score in MMR
    rerank-fusion-weight: ${CHAT_RERANK_FUSION_WEIGHT:0.5}

    # Enable optional LLM re-rank pass (falls back to MMR order on failure)
    rerank-llm-enabled: ${CHAT_RERANK_LLM_ENABLED:true}

    # Cosine similarity below this value triggers a low-confidence caveat in the prompt
    min-similarity-threshold: ${CHAT_MIN_SIMILARITY_THRESHOLD:0.4}

  llm:
    # Retry policy for a single (non-streamed) completion call
    max-attempts: ${CHAT_LLM_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${CHAT_LLM_INITIAL_BACKOFF_MS:500}

  stream:
    # Server-sent-event answer streaming
    timeout: ${CHAT_STREAM_TIMEOUT:PT3M}
    core-pool-size: ${CHAT_STREAM_CORE_POOL_SIZE:4}
    max-pool-size: ${CHAT_STREAM_MAX_POOL_SIZE:16}
    queue-capacity: ${CHAT_STREAM_QUEUE_CAPACITY:16}

    # Comment frame cadence. Proxies and load balancers close connections they believe are idle,
    # and retrieval alone can run longer than a default 30s idle timeout. Must stay comfortably
    # below the shortest idle timeout on the path to the browser.
    heartbeat-interval: ${CHAT_STREAM_HEARTBEAT_INTERVAL:PT15S}

    # How long a finished stream stays open for late metadata (a refined title). Only ever paid
    # on the first turn of a conversation; every other turn closes immediately.
    linger-grace: ${CHAT_STREAM_LINGER_GRACE:PT2S}

    # Timer threads driving keep-alives and lingers across all open streams.
    scheduler-pool-size: ${CHAT_STREAM_SCHEDULER_POOL_SIZE:2}

  # Retrieval confidence reported with every answer. Weights are relative and are normalised by
  # their total, so raising one does not require rebalancing the rest.
  confidence:
    top-similarity-weight: ${CHAT_CONFIDENCE_TOP_WEIGHT:0.35}
    mean-similarity-weight: ${CHAT_CONFIDENCE_MEAN_WEIGHT:0.25}
    page-agreement-weight: ${CHAT_CONFIDENCE_PAGE_WEIGHT:0.15}
    citation-weight: ${CHAT_CONFIDENCE_CITATION_WEIGHT:0.25}

    # Similarity at or below which a chunk contributes nothing to the score.
    similarity-floor: ${CHAT_CONFIDENCE_SIMILARITY_FLOOR:0.30}

    # Distinct agreeing pages treated as full corroboration.
    page-agreement-target: ${CHAT_CONFIDENCE_PAGE_TARGET:3}

    # Cited excerpts treated as full citation coverage.
    sufficient-citations: ${CHAT_CONFIDENCE_SUFFICIENT_CITATIONS:2}

  # Conversation titles are summarised by a cheap model call after the first exchange. The clipped
  # question is shown immediately and replaced only if the summary arrives and the user has not
  # renamed the conversation in the meantime.
  title:
    enabled: ${CHAT_TITLE_ENABLED:true}
    timeout: ${CHAT_TITLE_TIMEOUT:PT4S}
    core-pool-size: ${CHAT_TITLE_CORE_POOL_SIZE:1}
    max-pool-size: ${CHAT_TITLE_MAX_POOL_SIZE:4}
    queue-capacity: ${CHAT_TITLE_QUEUE_CAPACITY:32}

  # How much of a conversation is carried into the next answer. Without this every question is
  # answered as though it were the first one asked: "and in staging?" is searched for as those
  # three words, and the model has never seen what came before.
  context:
    enabled: ${CHAT_CONTEXT_ENABLED:true}

    # Previous question-and-answer pairs carried into the next turn. The prompt cost is capped at
    # this many times max-answer-chars however long the conversation runs.
    max-exchanges: ${CHAT_CONTEXT_MAX_EXCHANGES:6}

    # Characters kept of each previous answer. Enough to establish what was said; the detail is
    # re-retrieved for the question actually being asked.
    max-answer-chars: ${CHAT_CONTEXT_MAX_ANSWER_CHARS:1200}

    # Condense a follow-up into a standalone query before searching. Off, the model still sees the
    # conversation but retrieval does not, which answers the right question from the wrong pages.
    rewrite-enabled: ${CHAT_CONTEXT_REWRITE_ENABLED:true}

    # Ceiling on the latency this feature can add. Past it, retrieval proceeds with the question
    # as the user typed it.
    rewrite-timeout: ${CHAT_CONTEXT_REWRITE_TIMEOUT:PT3S}

    # Longest accepted rewrite. Anything longer is a model that answered instead of rewriting.
    rewrite-max-chars: ${CHAT_CONTEXT_REWRITE_MAX_CHARS:400}

    # Threads for the rewrite. It never queues: no free thread means search the raw question.
    core-pool-size: ${CHAT_CONTEXT_CORE_POOL_SIZE:2}
    max-pool-size: ${CHAT_CONTEXT_MAX_POOL_SIZE:8}

  # Presentation of the cited pages.
  source:
    # Characters of the matching passage shown under a citation, truncated on a word boundary.
    excerpt-max-length: ${CHAT_SOURCE_EXCERPT_MAX_LENGTH:240}

  session:
    # Untitled conversations with no messages are cleaned up once they are older than this
    abandoned-ttl: ${CHAT_ABANDONED_SESSION_TTL:PT1H}

# Background ingestion thread pool
ingestion:
  async:
    core-pool-size: ${INGESTION_CORE_POOL_SIZE:2}
    max-pool-size: ${INGESTION_MAX_POOL_SIZE:4}
    queue-capacity: ${INGESTION_QUEUE_CAPACITY:10}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # Mail is optional (planned for MVP2) — don't fail /actuator/health probing the SMTP
      # relay when it isn't configured, or make every health check depend on it once it is.
      enabled: false

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties.mail.smtp:
    auth: ${MAIL_SMTP_AUTH:true}
    starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
    starttls.required: ${MAIL_STARTTLS_REQUIRED:true}

logging:
  level:
    com.kssasarma.confluencebot: ${LOG_LEVEL_APP:INFO}
    org.springframework.ai: ${LOG_LEVEL_SPRING_AI:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
