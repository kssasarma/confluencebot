server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No backend proxy here. The frontend talks to the backend directly, at whatever absolute
    # URL VITE_API_BASE was built with — see frontend/.env.example. That keeps this container a
    # plain static file server with nothing backend-shaped to configure, wherever it ends up
    # mounted (root, a sub-path, a different host entirely).

    # SPA fallback — serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
