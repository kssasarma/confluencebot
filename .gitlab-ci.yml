stages:
  - deploy

# Publishes frontend/ as a static GitLab Pages site.
#
# The site's URL path is whatever this project's namespace/path is (e.g. group "karavindasar",
# project "ot-confluence-bot" -> served under "/karavindasar/ot-confluence-bot/", regardless of
# which Pages domain fronts it) — so the Vite `base` is derived from $CI_PROJECT_PATH at build
# time rather than hardcoded, and keeps working if the project is renamed or moved.
#
# The backend isn't part of this job: Pages only serves static files, so the API it talks to must
# already be reachable at its own public HTTPS URL with CORS enabled for the Pages origin. Point
# the build at it by setting a VITE_API_BASE CI/CD variable in this project's settings
# (Settings > CI/CD > Variables) — Vite picks up any VITE_-prefixed variable from the environment
# automatically. Left unset, it falls back to /api, which only works when a reverse proxy (like
# the bundled nginx.conf) sits in front of the built site.
pages:
  stage: deploy
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build -- --base="/${CI_PROJECT_PATH}/"
    - cd ..
    - rm -rf public
    - mv frontend/dist public
  artifacts:
    paths:
      - public
