stages:
  - deploy

variables:
  # The URL path the site is served from — everything after the Pages domain, e.g.
  # "/karavindasar/ot-confluence-bot/". Defaults to this project's own path, so it tracks a
  # rename/move automatically and needs no edit here. If the project is ever served from a
  # different path (a different group/project slug, a custom domain with its own prefix, ...),
  # override it with a PAGES_BASE_PATH CI/CD variable in Settings > CI/CD > Variables — that takes
  # precedence over this default without touching the pipeline or the code.
  PAGES_BASE_PATH: "/${CI_PROJECT_PATH}/"

# Publishes frontend/ as a static GitLab Pages site.
#
# The backend isn't part of this job: Pages only serves static files, so the API it talks to must
# already be reachable at its own public HTTPS URL with CORS enabled for the Pages origin. Point
# the build at it by setting a VITE_API_BASE CI/CD variable in this project's settings
# (Settings > CI/CD > Variables) — Vite picks up any VITE_-prefixed variable from the environment
# automatically. Left unset, it falls back to /api, which only works when a reverse proxy (like
# the bundled nginx.conf) sits in front of the built site.
pages:
  stage: deploy
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build -- --base="${PAGES_BASE_PATH}"
    - cd ..
    - rm -rf public
    - mv frontend/dist public
  artifacts:
    paths:
      - public
