services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: confluence-chatbot-db
    environment:
      POSTGRES_DB: ${DB_NAME:-confluencebot}
      POSTGRES_USER: ${DB_USERNAME:-confluencebot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-confluencebot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-confluencebot} -d ${DB_NAME:-confluencebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Confluence Chatbot Application ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confluence-chatbot-app
    env_file:
      - .env
    environment:
      # Override DB_URL so it points to the postgres service, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-confluencebot}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
