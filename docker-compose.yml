services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: confluence-chatbot-db
    environment:
      POSTGRES_DB: confluencebot
      POSTGRES_USER: confluencebot
      POSTGRES_PASSWORD: confluencebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confluencebot -d confluencebot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
