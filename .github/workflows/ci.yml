name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes the run it interrupts: reviewers only ever care about the head commit,
# and queued runs on stale commits are the main reason CI feedback arrives late.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --pretty false

      # Includes the palette contrast assertions: a token retuned below WCAG AA fails here.
      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify
